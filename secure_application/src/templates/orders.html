{% extends "base.html" %}

{% block content %}

<h1>My Order History</h1>

{% if orders %}

{% for order in orders %}

<div class="card">

    <h2>Order #{{ order.id }}</h2>

    <p>Total: ₹{{ "%.2f"|format(order.total) }}</p>

    <p>{{ order.created_at }}</p>

    <a href="{{ url_for('order_detail', order_id=order.id) }}">
        View Order
    </a>

</div>

{% endfor %}

{% else %}

<p>No orders yet.</p>

{% endif %}

{% endblock %}
