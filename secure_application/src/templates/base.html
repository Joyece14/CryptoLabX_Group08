<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Group 08 E-Commerce</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            color: #222;
        }

        nav {
            background: #172033;
            padding: 16px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            width: 250px;
            margin: 5px;
        }

        .warning {
            background: #fee2e2;
            padding: 15px;
            border-left: 5px solid #dc2626;
        }

        .success {
            background: #dcfce7;
            padding: 15px;
        }
    </style>
</head>

<body>

<nav>
    <a href="{{ url_for('index') }}">Products</a>
    <a href="{{ url_for('cart') }}">Cart</a>
    <a href="{{ url_for('search') }}">Search</a>

    {% if g.user %}
        <a href="{{ url_for('orders') }}">My Orders</a>
        <a href="{{ url_for('logout') }}">Logout ({{ g.user.username }})</a>
    {% else %}
        <a href="{{ url_for('login') }}">Login</a>
    {% endif %}
</nav>

<main>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="success">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

</body>
</html>
